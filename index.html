<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Пепел Драконов</title>
<style>
:root{--gold:#d7b56d;--panel:rgba(15,18,22,.92);--red:#a93030;--blue:#387bb5}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0d;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#26352a}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px)}
.top{display:flex;gap:7px;align-items:flex-start}.bars{width:min(55vw,270px)}
.bar{height:15px;margin-bottom:5px;border:1px solid #c5b080;background:#191919;border-radius:5px;overflow:hidden}.fill{height:100%}
#hp{background:#a72e2e}#mp{background:#346fac}#xp{background:#b58b35}
#info{font-size:12px;text-shadow:0 1px 2px #000}.badge{background:var(--panel);border:1px solid #796742;border-radius:7px;padding:5px 7px}
#quest{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 8px);width:min(42vw,230px);font-size:12px}
#msg{position:absolute;left:50%;top:22%;transform:translateX(-50%);max-width:85%;padding:9px 13px;background:rgba(0,0,0,.78);border:1px solid var(--gold);border-radius:8px;text-align:center;opacity:0;transition:.2s}
#joystick{pointer-events:auto;position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:126px;height:126px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.25)}
#stick{position:absolute;left:39px;top:39px;width:46px;height:46px;border-radius:50%;background:rgba(215,181,109,.65);border:2px solid #f2d795}
.actions{pointer-events:auto;position:absolute;right:15px;bottom:calc(env(safe-area-inset-bottom) + 18px);display:grid;grid-template-columns:58px 58px;gap:9px;transform:rotate(-8deg)}
.btn{width:58px;height:58px;border:1px solid #d5bd82;border-radius:50%;background:rgba(35,30,25,.82);color:white;font-weight:800;font-size:11px;box-shadow:0 2px 7px #000}.btn:active{background:#6b5430}.btn.cooldown{opacity:.45;filter:grayscale(.7)}.btn:disabled{opacity:.35}.wide{border-radius:12px;width:125px;height:40px}
#menuBtn{pointer-events:auto;position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 160px);background:var(--panel);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:8px 11px}
.panel{display:none;position:fixed;z-index:5;inset:4% 4%;padding:16px;background:linear-gradient(#17191d,#0e1012);border:2px solid var(--gold);border-radius:12px;overflow:auto;touch-action:pan-y}
.panel h2{color:#e6c77b;margin:0 0 10px}.panel button{touch-action:manipulation;background:#2b3037;color:#fff;border:1px solid #7e704e;border-radius:7px;padding:9px;margin:4px}.panel .close{position:sticky;float:right;top:0;background:#6d2727}.card{border:1px solid #4d4d4d;border-radius:8px;padding:9px;margin:7px 0;background:#1e2227}.selected{border-color:#dfb951;background:#332c1e}.small{font-size:12px;color:#bbb}
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#26372e,#090b0d)}#start h1{font-family:Georgia,serif;font-size:38px;color:#e3c074;text-shadow:0 3px 8px #000;margin:5px}#start p{max-width:520px}#start button{font-size:17px;padding:13px 25px;background:#5d4828;border:1px solid #e4c47b;color:#fff;border-radius:8px}
@media(min-width:800px){#joystick{width:145px;height:145px}.actions{grid-template-columns:68px 68px}.btn{width:68px;height:68px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="top"><div class="bars"><div class="bar"><div id="hp" class="fill"></div></div><div class="bar"><div id="mp" class="fill"></div></div><div class="bar"><div id="xp" class="fill"></div></div><div id="info" class="badge"></div></div></div>
 <div id="quest" class="badge"></div><div id="msg"></div>
 <div id="joystick"><div id="stick"></div></div>
 <div class="actions"><button class="btn" id="attack">УДАР</button><button class="btn" id="magic">МАГИЯ</button><button class="btn" id="interact">ГОВОРИТЬ</button><button class="btn" id="potion">ЗЕЛЬЕ</button></div>
 <button id="menuBtn">☰ Герой</button>
</div>
<div id="start" class="panel" style="display:flex">
 <h1>Пепел Драконов</h1><p>Открытый мир Эйргарда, 1207 год. Драконы вернулись, древняя кровь пробудилась, а города готовятся к войне.</p>
 <p class="small">Сенсорная RPG-игра для Safari. Лучше играть горизонтально.</p><button id="begin">Начать путь</button>
</div>
<div id="menu" class="panel"><button class="close" onclick="closeMenu()">Закрыть</button><h2>Герой</h2><div id="stats"></div><h2>Оружие</h2><div id="weapons"></div><h2>Доспехи</h2><div id="armors"></div><h2>Путь крови</h2><div id="blood"></div><button onclick="saveGame()">Сохранить игру</button><button onclick="resetGame()">Начать заново</button></div>

 for(let it of items)if(!it.taken&&dist(p,it)<35){it.taken=true;let q=p.activeQuest!=null?quests[p.activeQuest]:null;if(q&&q.type===it.type){q.count++;checkQuest(q)}showMsg(it.type==='ore'?'Найдена звёздная руда':'Найден осколок печати')}
 for(let a of particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt}particles=particles.filter(a=>a.life>0);spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=3}if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)document.getElementById('msg').style.opacity=0}updateHUD()}
function draw(){let camX=Math.max(0,Math.min(world.w-W,p.x-W/2)),camY=Math.max(0,Math.min(world.h-H,p.y-H/2));ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-camX,-camY);
 let tile=100;for(let x=Math.floor(camX/tile)*tile;x<camX+W+tile;x+=tile)for(let y=Math.floor(camY/tile)*tile;y<camY+H+tile;y+=tile){let v=(Math.sin(x*.013+y*.009)+1)/2;ctx.fillStyle=v>.58?'#31452f':'#293c2c';ctx.fillRect(x,y,tile+1,tile+1)}
 ctx.strokeStyle='#88704b';ctx.lineWidth=28;ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(520,530);ctx.lineTo(2020,560);ctx.lineTo(3370,760);ctx.moveTo(2020,560);ctx.lineTo(900,2380);ctx.lineTo(3110,2310);ctx.stroke();ctx.globalAlpha=1;
 for(let t of towns){ctx.fillStyle=t.c;ctx.fillRect(t.x-100,t.y-80,200,160);ctx.strokeStyle='#d0b77b';ctx.strokeRect(t.x-100,t.y-80,200,160);for(let i=-60;i<=60;i+=60){ctx.fillStyle='#382e24';ctx.fillRect(t.x+i-18,t.y-28,36,56);ctx.fillStyle='#704a35';ctx.beginPath();ctx.moveTo(t.x+i-25,t.y-28);ctx.lineTo(t.x+i,t.y-55);ctx.lineTo(t.x+i+25,t.y-28);ctx.fill()}label(t.n,t.x,t.y-92,'#f2dda0',13)}
 for(let it of items)if(!it.taken){ctx.fillStyle=it.type==='ore'?'#b8c7d7':'#985cff';ctx.beginPath();ctx.arc(it.x,it.y,7,0,7);ctx.fill()}
 for(let n of npcs){ctx.fillStyle='#e0bd76';ctx.beginPath();ctx.arc(n.x,n.y,13,0,7);ctx.fill();ctx.fillStyle='#294e74';ctx.fillRect(n.x-10,n.y+10,20,25);label('!',n.x,n.y-22,'#ffd85b',18)}
 for(let e of enemies)if(e.hp>0){ctx.fillStyle=e.hit?'#fff':e.type==='dragon'?'#882d24':e.type==='vampire'?'#632354':e.type==='troll'?'#768688':e.type==='wolf'?'#6d685f':e.type==='bandit'?'#824f38':'#c3c1ad';let r=e.boss?32:17;ctx.beginPath();ctx.arc(e.x,e.y,r,0,7);ctx.fill();if(e.boss)label(e.n,e.x,e.y-r-18,'#ffcf87',13);ctx.fillStyle='#222';ctx.fillRect(e.x-25,e.y-r-10,50,5);ctx.fillStyle='#b42e2e';ctx.fillRect(e.x-25,e.y-r-10,50*(e.hp/e.max),5)}
 for(let pr of projectiles){ctx.fillStyle='#65b7ff';ctx.beginPath();ctx.arc(pr.x,pr.y,9,0,7);ctx.fill()}
 for(let a of particles){ctx.globalAlpha=a.life*2;ctx.fillStyle=a.c;ctx.fillRect(a.x,a.y,4,4)}ctx.globalAlpha=1;
 ctx.save();if(timers.invulnerable>0&&Math.floor(timers.invulnerable*14)%2===0)ctx.globalAlpha=.35;
 if(HERO_EXACT_ATLAS.complete&&HERO_EXACT_ATLAS.naturalWidth){let fw=HERO_EXACT_ATLAS.naturalWidth/4,fh=HERO_EXACT_ATLAS.naturalHeight/4,fr=actionState==='move'?heroExactAnim.frame:0,sx=fr*fw,sy=heroExactAnim.dir*fh,sz=108;ctx.drawImage(HERO_EXACT_ATLAS,sx,sy,fw,fh,p.x-sz/2,p.y-sz*.72,sz,sz)}else{ctx.fillStyle='#8d2633';ctx.beginPath();ctx.arc(p.x,p.y,18,0,7);ctx.fill()}
 if(actionState==='attack'){let a=Math.atan2(facing.y,facing.x);ctx.strokeStyle='#f5d48a';ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,38,a-.8,a+.8);ctx.stroke()}
 if(actionState==='cast'){ctx.strokeStyle='#65b7ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,27,0,Math.PI*2);ctx.stroke()}
 ctx.restore();ctx.restore()}
function label(s,x,y,c,size){ctx.textAlign='center';ctx.font='bold '+size+'px system-ui';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=c;ctx.fillText(s,x,y)}
function updateHUD(){document.getElementById('hp').style.width=100*p.hp/p.maxHp+'%';document.getElementById('mp').style.width=100*p.mp/p.maxMp+'%';document.getElementById('xp').style.width=100*p.xp/(p.lvl*70)+'%';document.getElementById('info').textContent=`Ур. ${p.lvl} • ${p.gold} зол. • ${weapons[p.weapon].n} • ${p.form}`;let q=p.activeQuest!=null?quests[p.activeQuest]:null;document.getElementById('quest').textContent=q?(q.done?'✓ ':'')+q.name+` (${q.count}/${q.goal})`:'Поговорите со старостой в городе';
 const nearNpc=npcs.some(n=>dist(p,n)<100),nearTown=towns.some(t=>dist(p,t)<150);
 document.getElementById('interact').textContent=nearNpc?'ГОВОРИТЬ':nearTown?'ОТДЫХ':'ДЕЙСТВИЕ';
 document.getElementById('potion').textContent='ЗЕЛЬЕ '+p.potions;
 setButtonState('attack',timers.attack,ACTIONS.attack.cooldown);setButtonState('magic',timers.magic,ACTIONS.magic.cooldown);setButtonState('interact',timers.interact,ACTIONS.interact.cooldown);setButtonState('potion',timers.potion,ACTIONS.potion.cooldown)
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function bindHold(id,fn){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn()})}bindHold('attack',attack);bindHold('magic',magic);bindHold('interact',interact);bindHold('potion',potion);
const j=document.getElementById('joystick'),st=document.getElementById('stick');let jid=null;function setJoy(e){let r=j.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.hypot(x,y),lim=42;if(m>lim){x=x/m*lim;y=y/m*lim}joy.x=x/lim;joy.y=y/lim;st.style.transform=`translate(${x}px,${y}px)`}j.addEventListener('pointerdown',e=>{jid=e.pointerId;j.setPointerCapture(jid);setJoy(e)});j.addEventListener('pointermove',e=>{if(e.pointerId===jid)setJoy(e)});function endJoy(e){if(e.pointerId===jid){jid=null;joy.x=joy.y=0;st.style.transform=''}}j.addEventListener('pointerup',endJoy);j.addEventListener('pointercancel',endJoy);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')attack();if(e.key.toLowerCase()==='q')magic();if(e.key.toLowerCase()==='e')interact();if(e.key==='Escape'&&gameMode==='menu')closeMenu()});addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('begin').onclick=()=>{document.getElementById('start').style.display='none';gameMode='playing';actionState='idle'};document.getElementById('menuBtn').onclick=openMenu;
function openMenu(){if(gameMode==='start'||gameMode==='respawn')return;gameMode='menu';joy.x=joy.y=0;st.style.transform='';document.getElementById('menu').style.display='block';document.getElementById('stats').innerHTML=`<div class=card>Уровень: ${p.lvl}<br>Здоровье: ${Math.ceil(p.hp)}/${p.maxHp}<br>Мана: ${Math.ceil(p.mp)}/${p.maxMp}<br>Убито врагов: ${p.kills}<br>Облик: ${p.form}</div>`;document.getElementById('weapons').innerHTML=p.unlockedW.map(i=>`<button class="${p.weapon===i?'selected':''}" onclick="p.weapon=${i};openMenu()">${weapons[i].n}<br><span class=small>${weapons[i].kind}, урон ${weapons[i].d}</span></button>`).join('');document.getElementById('armors').innerHTML=p.unlockedA.map(i=>`<button class="${p.armor===i?'selected':''}" onclick="p.armor=${i};openMenu()">${armors[i].n}<br><span class=small>Защита ${armors[i].a}</span></button>`).join('');document.getElementById('blood').innerHTML='<div class=card>Вампир получает повышенную скорость и защиту. Звериная метка может стать основой будущей ветки оборотня. Победите лорда в Кровавом Холме, чтобы принять дар крови.</div>'}
function closeMenu(){document.getElementById('menu').style.display='none';gameMode='playing';actionState='idle'}
function saveGame(){localStorage.setItem('dragonAshSave',JSON.stringify({p,quests,items}));showMsg('Игра сохранена');closeMenu()}
function loadGame(){try{let s=JSON.parse(localStorage.getItem('dragonAshSave'));if(s){Object.assign(p,s.p);s.quests.forEach((q,i)=>Object.assign(quests[i],q));if(s.items)items=s.items;showMsg('Сохранение загружено')}}catch(e){}}
function resetGame(){localStorage.removeItem('dragonAshSave');location.reload()}loadGame();
